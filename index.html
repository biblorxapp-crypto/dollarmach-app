<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .dollar {
      font-size: 80px;
      color: #00ff4c; /* verde neón */
      margin-bottom: 10px;
    }

    .coming-soon {
      font-size: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="dollar">$</div>
  <div class="coming-soon">Coming Soon</div>
</body>
</html>
