<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALT FIX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>body{background:#030712;color:#fff;font-family:monospace;padding:20px}input{padding:12px;width:100%;margin:5px 0;background:#020617;color:#fff;border:1px solid #334155;border-radius:8px}.btn{padding:14px;width:100%;background:#10b981;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:10px}</style>
</head><body>
<h3>TEST NUBE GLOBAL</h3>
<input id="in-letras" placeholder="AVD" value="AVD">
<input id="in-numeros" placeholder="12131415" value="12131415">
<input id="in-nombre" placeholder="Orly1" value="Orly1">
<button class="btn" onclick="verificarBillete()">1 VERIFICAR</button>
<button class="btn" style="background:#0ea5e9" onclick="bajarABoveda()">2 BAJAR A NUBE</button>
<div id="log"></div>
<script>
const supabaseClient = supabase.createClient("https://hvdaitsnvwigqbizirbi.supabase.co","sb_publishable_Lf1Bd6_mvlAlZCdcYBBR5A_fTjpEiyv");
let billeteActual=null;
function verificarBillete(){
  const letras=document.getElementById('in-letras').value;
  const numeros=document.getElementById('in-numeros').value;
  const nombre=document.getElementById('in-nombre').value;
  billeteActual={id:'bill-'+Date.now(), letras, numeros, anio:'2024', pais:'USD', flag:'🇺🇸', nombre, peso:150, valor:150, serial:'VALT-'+letras+'-'+numeros, timestamp:Date.now()};
  alert('OK '+billeteActual.serial);
  document.getElementById('log').innerHTML='Verificado: '+billeteActual.serial;
}
async function bajarABoveda(){
  if(!billeteActual){alert('Verifica primero');return;}
  const {data,error}=await supabaseClient.from('bills').insert([billeteActual]).select();
  if(error) alert('Error: '+error.message);
  else alert('✅ EN NUBE GLOBAL!');
}
</script></body></html>
