<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>DollarDgT.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      color: #111827;
    }

    .wrapper {
      text-align: center;
      padding: 1rem;
    }

    .brand {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: #111827;
      margin-bottom: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 18px;
      padding: 1.8rem 1.6rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.35);
      text-align: left;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1.4rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.35rem;
    }

    .field input {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      background: #f9fafb;
    }

    .field input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 1px #11182715;
      background: #ffffff;
    }

    .btn {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.7rem 0.9rem;
      border-radius: 999px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      background: #111827;
      color: #f9fafb;
      transition: background 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      background: #020617;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }

    .footer-note {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">DollarDgT.com</div>

    <div class="card">
      <div class="card-title">Acceso privado.</div>
      <div class="card-subtitle">Interfaz en construcción. Ingresa tus datos para continuar.</div>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="tu@correo.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>

        <button type="button" class="btn">Entrar</button>
      </form>

      <div class="footer-note">
        DollarDgT · Espacio digital en fase inicial.
      </div>
    </div>
  </div>
</body>
</html>
