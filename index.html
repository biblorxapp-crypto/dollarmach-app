<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En Construcción</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#000;color:#fff;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  body::before{
    content:"";position:fixed;inset:-50%;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    opacity:.35;pointer-events:none;
    animation:grainMove 8s steps(10) infinite;
  }
  @keyframes grainMove{0%{transform:translate(0,0)}100%{transform:translate(5%,0)}}
  .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.6}
  .blob1{width:600px;height:600px;background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);top:-10%;left:-10%;animation:float1 22s ease-in-out infinite}
  .blob2{width:800px;height:800px;background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);bottom:-20%;right:-15%;animation:float2 26s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.1)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.08)}}
  .wrap{position:relative;z-index:2;width:100%;max-width:720px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo-box{position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center;perspective:800px}
  .logo-glow{position:absolute;width:100%;height:100%;border-radius:36px;background:radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);filter:blur(18px);animation:glowPulse 3.2s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{transform:scale(0.9);opacity:.6}50%{transform:scale(1.15);opacity:1}}
  .logo{position:relative;width:96px;height:96px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.08);border-radius:28px;box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset, 0 20px 60px rgba(0,0,0,0.8), 0 0 80px rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:logoFloat 5s ease-in-out infinite;transform-style:preserve-3d;transition:transform 0.2s ease-out}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .logo svg{width:54px;height:54px;filter:drop-shadow(0 0 18px rgba(255,255,255,0.35))}
  .shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,0) 30%, rgba(255,255,255,0.85) 50%, transparent 80%);mix-blend-mode:soft-light;animation:shimmerSweep 3.2s ease-in-out infinite}
  @keyframes shimmerSweep{0%{left:-100%}50%{left:120%}100%{left:120%}}
  .kicker{margin-top:28px;font-size:10.5px;letter-spacing:0.42em;font-weight:300;color:rgba(255,255,255,0.5);text-transform:uppercase}
  .title{margin-top:28px;font-family:'Instrument Serif', Georgia, serif;font-size:clamp(32px, 7vw, 56px);line-height:0.95;letter-spacing:-0.02em}
  .title i{font-weight:300;color:rgba(255,255,255,0.9)}
  .desc{margin-top:22px;max-width:400px;font-size:14.5px;font-weight:300;line-height:1.7;color:#8a8a8a}
  .loader{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .dots{display:flex;gap:9px}
  .dot{width:4px;height:4px;border-radius:50%;background:#fff;animation:dotBounce 1.4s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes dotBounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .bar{width:112px;height:1px;background:rgba(255,255,255,0.08);overflow:hidden;border-radius:99px;position:relative}
  .bar-inner{position:absolute;left:0;top:0;width:56px;height:100%;background:#fff;animation:progress 1.8s cubic-bezier(0.4,0,0.2,1) infinite}
  @keyframes progress{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
  .cta{margin-top:44px}
  .btn{height:40px;padding:0 24px;border-radius:999px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);font-size:13px;backdrop-filter:blur(12px);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .3s}
  .btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.14);color:#fff}
  .notify{display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:5px 5px 5px 20px;backdrop-filter:blur(18px)}
  .notify.active{display:flex;animation:fadeUp .5s cubic-bezier(0.16,1,0.3,1)}
  .notify input{background:transparent;border:0;outline:0;color:#fff;font-size:13.5px;width:200px}
  .notify input::placeholder{color:rgba(255,255,255,0.3)}
  .notify button{height:32px;padding:0 18px;border-radius:999px;background:#fff;color:#000;font-size:12.5px;font-weight:500;border:0;cursor:pointer}
  footer{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;font-size:10.5px;letter-spacing:0.18em;color:rgba(255,255,255,0.18);font-weight:300;border-top:1px solid rgba(255,255,255,0.05)}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:#141414;border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:11px 20px;display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .5s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-box" id="logoBox">
    <div class="logo-glow"></div>
    <div class="logo" id="logo">
      <div class="shimmer"></div>
      <svg viewBox="0 0 100 128" fill="none"><path d="M 32 12 C 32 12, 68 12, 68 36 C 68 60, 32 60, 32 86 C 32 110, 68 110, 68 110" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 4 L 50 20" stroke="white" stroke-width="14" stroke-linecap="round"/><path d="M 50 106 L 50 124" stroke="white" stroke-width="14" stroke-linecap="round"/></svg>
    </div>
  <div class="kicker">En construcción</div>
  <h1 class="title">Estamos construyendo<br><i>algo grande.</i></h1>
  <p class="desc">Estamos puliendo cada detalle para darte la mejor experiencia. Muy pronto estaremos en línea.</p>
  <div class="loader"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="bar"><div class="bar-inner"></div></div></div>
  <div class="cta"><button class="btn" id="btnOpen">● Notificarme</button><div class="notify" id="notifyBox"><input type="email" id="emailInput" placeholder="tu@email.com"><button id="btnSend">Avisarme</button></div></div>
</div>
<footer>© 2026 — VOLVEMOS PRONTO</footer>
<div class="toast" id="toast">✓ ¡Te avisaremos!</div>
<script>
  const logo=document.getElementById('logo');
  document.addEventListener('mousemove',e=>{
    const x=(e.clientX/window.innerWidth-0.5)*20, y=(e.clientY/window.innerHeight-0.5)*-20;
    logo.style.transform=`translateY(-4px) rotateY(${x}deg) rotateX(${y}deg)`;
  });
  const btnOpen=document.getElementById('btnOpen'), notifyBox=document.getElementById('notifyBox'), btnSend=document.getElementById('btnSend'), toast=document.getElementById('toast'), emailInput=document.getElementById('emailInput');
  btnOpen.onclick=()=>{btnOpen.style.display='none';notifyBox.classList.add('active');emailInput.focus()};
  btnSend.onclick=()=>{if(emailInput.value.includes('@')){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);notifyBox.classList.remove('active');btnOpen.style.display='inline-flex';emailInput.value=''}};
</script>
</body>
</html>
